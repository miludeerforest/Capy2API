services:
  capy2api:
    build: .
    image: capy2api:local
    container_name: capy2api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18099:8080"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
